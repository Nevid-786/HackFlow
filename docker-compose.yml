services:
  mongo:
    image: mongo
    container_name: hackflow-mongo

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./Backend

    container_name: hackflow-backend

    depends_on:
      - mongo

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      MONGO_URL: mongodb://mongo:27017/hackflow
      ACCESS_TOKEN_SECRET: adskbcabkaaa
      REFRESH_TOKEN_SECRET: adskbcabkaHGCHSSBCaa
      ACCESS_TOKEN_EXPIRES_IN: 24h
      REFRESH_TOKEN_EXPIRES_IN: 24h
      FRONTENDURL: http://localhost:5173

    volumes:
      - ./Backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Frontend

    container_name: hackflow-frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:3000

    volumes:
      - ./Frontend:/app
      - /app/node_modules

volumes:
  mongo_data: